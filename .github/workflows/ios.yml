name: Build unsigned iOS IPA
on:
  push:
    branches:
      - main
      - 'upgrade/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build and package
        env:
          FTCTEAMHUB_FIREBASE_PLIST_BASE64: ${{ secrets.FTCTEAMHUB_FIREBASE_PLIST_BASE64 }}
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FTCTeamHub-unsigned-ipa
          path: |
            build/release/*.ipa
            build/release/sha256.txt
            build/release/commit.txt
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FTCTeamHub-ios-build-log
          path: build/release/xcodebuild.log
          if-no-files-found: ignore

  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Run iOS unit and smoke tests
        env:
          FTCTEAMHUB_SIMULATOR_RUNTIME: iOS-26-2
        run: |
          pnpm --dir firebase install --frozen-lockfile --ignore-scripts
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' Resources/Info.plist
          firebase/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-ftcteamhub 'curl -fsS --max-time 8 http://localhost:9099/ && node firebase/seed-native.mjs && bash scripts/test-ios.sh'
          grep -E 'testNativeClientsShareRecordsAndReplayDurableOutbox.*passed' build/test/xcodebuild-test.log
      - name: Upload simulator screenshots and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FTCTeamHub-simulator-results
          path: |
            build/test/xcodebuild-test.log
            build/test/screenshots
          if-no-files-found: ignore

  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Test Firebase rules and collaboration
        run: |
          pnpm --dir firebase install --frozen-lockfile --ignore-scripts
          firebase/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-ftcteamhub 'node --test firebase/workspace.test.mjs'
