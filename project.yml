name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Features
      - Shared
      - Previews
      - path: Resources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    scheme:
      testTargets: [FTCTeamHubTests, FTCTeamHubUITests]
  FTCTeamHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FTCTeamHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  FTCTeamHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FTCTeamHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "8.0.0"
